---
- name: Configurar Servidor Web Apache na AMI
  hosts: all
  become: true

  tasks:
    - name: Atualizar cache do apt e instalar o Apache
      ansible.builtin.apt:
        name: apache2
        state: present
        update_cache: true

    - name: Criar pagina HTML personalizada
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        content: |
          <!DOCTYPE html>
          <html lang="pt-BR">
          <head>
              <meta charset="UTF-8">
              <title>Desafio IaC - Packer & Ansible</title>
              <style>
                  body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
                  h1 { color: #2c3e50; }
                  p { color: #555; }
              </style>
          </head>
          <body>
              <h1>Servidor Apache Provisionado via Packer + Ansible</h1>
              <p>Infraestrutura Imutavel executando na AWS EC2!</p>
          </body>
          </html>
        owner: www-data
        group: www-data
        mode: "0644"

    - name: Garantir que o servico Apache esteja rodando e habilitado no boot
      ansible.builtin.systemd:
        name: apache2
        state: started
        enabled: true